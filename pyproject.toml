[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "TCParse"
version = "0.1.0"
requires-python = ">=3.9"
authors = [
    {name = "Christopher Myers", email = "myers.christopher@proton.me"}
]
readme = "README.md"
keywords = ["parsing", "science", "research"]
homepage = "https://github.com/ChristopherAMyers/tcparse"
repository = "https://github.com/ChristopherAMyers/tcparse"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Topic :: Libraries :: Python Modules",
  "Development Status :: 4 - Beta"
]

[project.dependencies]
numpy = ">=1.23"
pandas = ">=2.1.1"
pydantic = "*"
